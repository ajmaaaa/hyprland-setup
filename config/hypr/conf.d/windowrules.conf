# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀  █▀▄ █▄█ █▄▄ ██▄ ▄█
# ============================================================
# Hyprland windowrulev2 — resolving popup/floating issues
# which are the main limitations of SwayFX
# ============================================================

# =============================================================
# FLOATING RULES — Dialog, Popup, Splash
# =============================================================

windowrulev2 = float, title:^(.*)(\bconfirm\b|\bdialog\b|\bprompt\b|\balert\b)(.*)$
windowrulev2 = center 1, title:^(.*)(\bconfirm\b|\bdialog\b|\bprompt\b|\balert\b)(.*)$
windowrulev2 = float, xdg_tag:^(dialog|modal)$
windowrulev2 = center 1, xdg_tag:^(dialog|modal)$
windowrulev2 = float, modal:1
windowrulev2 = center 1, modal:1
windowrulev2 = float, initialClass:^(file_progress)$
windowrulev2 = center 1, initialClass:^(file_progress)$
windowrulev2 = float, class:^(org.freedesktop.impl.portal.desktop.kde)$
windowrulev2 = center 1, class:^(org.freedesktop.impl.portal.desktop.kde)$

# Small windows automatically float (fix Zoom pencil popup, etc.)
windowrulev2 = float, xwayland:1, size < 800 600

# =============================================================
# ZOOM — Fix popup annotation / pencil overlay
# =============================================================

windowrulev2 = float,      class:^(zoom)$
windowrulev2 = float,      title:^(Zoom)(.*)$
windowrulev2 = nofocus,    title:^(zoom)$, class:^(zoom)$
windowrulev2 = noblur,     title:^(zoom)$, class:^(zoom)$
windowrulev2 = noshadow,   title:^(zoom)$, class:^(zoom)$

# Zoom main window — stays tiled
windowrulev2 = tile, title:^(Zoom Meeting)(.*)$

# =============================================================
# PACKETTRACER — same as sway
# =============================================================

windowrulev2 = float,    class:^(PacketTracer)$
windowrulev2 = tile,     class:^(PacketTracer)$, title:^(Cisco Packet Tracer)$
windowrulev2 = rounding 8, class:^(PacketTracer)$

# =============================================================
# FILE DIALOGS
# =============================================================

# Center on the monitor rather than either half of a split workspace.
windowrulev2 = float, class:^(xdg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.kde)$
windowrulev2 = size 60% 60%, class:^(xdg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.kde)$
windowrulev2 = center, class:^(xdg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.kde)$
windowrulev2 = suppressevent maximize fullscreen, class:^(xdg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.kde)$

windowrulev2 = float, title:^(File Upload|Open File|Open Folder|Select a File|Select Folder|Choose wallpaper|Save File|Save As)(.*)$
windowrulev2 = size 60% 60%, title:^(File Upload|Open File|Open Folder|Select a File|Select Folder|Choose wallpaper|Save File|Save As)(.*)$
windowrulev2 = center, title:^(File Upload|Open File|Open Folder|Select a File|Select Folder|Choose wallpaper|Save File|Save As)(.*)$
windowrulev2 = suppressevent maximize fullscreen, title:^(File Upload|Open File|Open Folder|Select a File|Select Folder|Choose wallpaper|Save File|Save As)(.*)$

# =============================================================
# COMMON POPUP APPS
# =============================================================

windowrulev2 = float,    class:^(pavucontrol)$
windowrulev2 = float,    class:^(blueman-manager)$
windowrulev2 = float,    class:^(nm-connection-editor)$
windowrulev2 = float,    class:^(polkit-kde-authentication-agent-1)$

# =============================================================
# OPACITY
# =============================================================

windowrulev2 = opacity 0.75 0.70, class:^(alacritty)$
windowrulev2 = opacity 0.95 0.90, class:^(dolphin)$

# Connections popup
windowrulev2 = float, class:^(local\.hyprland\.Connections|hypr-connections)$
windowrulev2 = size 860 520, class:^(local\.hyprland\.Connections|hypr-connections)$
windowrulev2 = center, class:^(local\.hyprland\.Connections|hypr-connections)$

# ArchTidy cleaner popup
windowrulev2 = float, class:^(archtidy)$
windowrulev2 = size 1060 680, class:^(archtidy)$
windowrulev2 = center, class:^(archtidy)$
